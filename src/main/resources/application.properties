spring.application.name=Rideflow-AuthService

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/uberdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:local-development-secret-change-this-before-deploying-123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
cookie.expiration-seconds=${COOKIE_EXPIRATION_SECONDS:3600}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.paths-to-match=/api/v1/auth/**
springdoc.override-with-generic-response=false
